name: pr-unit-tests
on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: docker compose -f .docker/docker-compose.yml up -d

      - name: Stack PHP 8.2 | Installing dependencies
        run: docker exec stackPhp852 composer install --optimize-autoloader

      - name: Stack PHP 8.2 | Executando testes únitarios
        run: docker exec stackPhp852 ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Removing vendor folder and composer.lock file
        run: docker exec stackPhp852 rm -rf vendor composer.lock

      - name: Stack PHP 8.5 | Installing dependencies
        run: docker exec stackPhp85 composer install --optimize-autoloader

      - name: Stack PHP 8.5 | Executando testes únitarios
        run: docker exec stackPhp85 ./vendor/bin/phpunit --coverage-clover=coverage.xml
